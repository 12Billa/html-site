<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Doctor Appointment System</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #89f7fe, #66a6ff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background: white;
        padding: 25px;
        width: 400px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    input, button {
        width: 100%;
        padding: 10px;
        margin-top: 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    button {
        background: #4CAF50;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover { background: #45a049; }

    .result {
        background: #f2f2f2;
        padding: 12px;
        border-radius: 8px;
        margin-top: 15px;
        font-size: 14px;
        line-height: 1.5;
    }
</style>
</head>
<body>
<div class="container">
    <h2>AI Doctor Appointment System</h2>
    <form method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="number" name="age" placeholder="Your Age" required>
        <input type="text" name="symptom" placeholder="Your Symptom (fever, cough…)" required>
        <button type="submit">Get Doctor & Appointment</button>
    </form>

    {% if result %}
    <div class="result">
        <b>Recommended Doctor:</b> {{ doctor }}<br>
        <b>Patient Name:</b> {{ name }}<br>
        <b>Age:</b> {{ age }}<br>
        <b>Symptom:</b> {{ symptom }}<br>
        <b>Appointment Date:</b> {{ date }}<br>
        <b>Appointment Time:</b> {{ time }}<br>
        ✅ Appointment Fixed Successfully
    </div>
    {% endif %}
</div>
</body>
</html>

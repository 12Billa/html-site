<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HTML Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #0077cc;
            color: white;
            padding: 30px 0;
        }
        h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        p {
            font-size: 1.2rem;
            margin: 20px 0;
        }
        .content {
            margin: 50px 20px;
        }
        footer {
            background-color: #222;
            color: white;
            padding: 15px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        a {
            color: #0077cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        button {
            background-color: #0077cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>

<header>
    <h1>Hello from Jenkins 🚀</h1>
</header>

<div class="content">
    <p>Welcome to my HTML site deployed automatically using Jenkins + Docker!</p>
    <p>Every time I push code to GitHub, Jenkins builds and updates this website.</p>

    <button onclick="alert('You clicked me!')">Click Me</button>
</div>

<footer>
    <p>Created with ❤️ by <a href="https://github.com/12Billa" target="_blank">12Billa</a></p>
</footer>

</body>
</html>
